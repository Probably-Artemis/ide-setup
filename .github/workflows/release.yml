name: Attach starter zip to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build zip
        run: |
          mkdir ide-setup
          cp -r .vscode .gitignore ide-setup/
          zip -r ide-setup.zip ide-setup

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ide-setup.zip --clobber
